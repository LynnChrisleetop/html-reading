<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oxford Phonics · 点读书</title><link rel="stylesheet" href="style.css"></head>
<body>
<button id="tocMenu" aria-label="打开教材目录" aria-expanded="false" aria-controls="bookSidebar">☰ 目录</button><button id="tocBackdrop" aria-label="关闭目录遮罩" hidden></button>
<aside id="bookSidebar"><div class="brand"><span class="mark">op<span>3</span></span><div>Oxford Phonics<small>你的英语点读书</small></div></div><div class="toc-title"><div><span class="book-label">LONG VOWELS</span><h2>教材目录</h2></div><button id="tocClose" aria-label="关闭目录">×</button></div><div class="toc-note">页码与书本目录一致 <button id="originalContents">查看原目录 ↗</button></div><div id="contents" role="navigation" aria-label="教材目录"></div><div class="side-actions"><button id="edit">调整音频区域</button><a href="book.pdf" target="_blank">查看原始 PDF ↗</a></div><div class="foot">Oxford Phonics World 3<br><span>本地教材 · 随时跟读</span></div></aside>
<main><header><div><span class="eyebrow">LET’S READ & LISTEN</span><h2>读一页，听世界。</h2></div><div class="badge">● 离线点读</div></header>
<nav aria-label="阅读控制"><div class="pager"><button id="prev" aria-label="上一页">←</button><label>第 <input id="pageNumber" type="number" min="1" value="1" aria-label="PDF 页码"> / <span id="total">—</span> 页</label><button id="next" aria-label="下一页">→</button></div><div class="view-controls"><button id="zoomOut" aria-label="缩小">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="hints" aria-pressed="true">隐藏点击区域</button></div></nav>
<div id="editor" hidden><strong>区域编辑</strong><p>在书页上拖出矩形，选择光盘和曲目。更改保存在当前浏览器；导出后可纳入仓库。</p><label>Disc <select id="disc"><option>1</option><option>2</option></select></label> <label>Track <input id="track" type="number" min="1" max="99" value="1"></label><button id="export">导出坐标</button><button id="reset">恢复本页初始区域</button><p>点击已有区域可删除。完成后再点“结束调整”。</p></div>
<details id="library"><summary>全部音频</summary><div><select id="audioList" aria-label="选择音频"></select><button id="libraryPlay">播放所选音频</button></div></details><p id="status" role="status">正在打开教材…</p><section id="viewport"><div id="sheet"><img id="pageImage" alt="教材书页" draggable="false"><div id="hotspots"></div><div id="selection" hidden></div></div></section><div id="pageTracks"></div>
</main>
<section id="player" aria-label="音频播放器" hidden><div class="now"><span class="sound">♫</span><div><strong id="trackTitle">Disc 1 · Track 01</strong><small id="playingState">准备播放</small></div></div><div class="play-controls"><button id="back" aria-label="后退5秒">↶ 5s</button><button id="play" aria-label="播放或暂停">▶</button><button id="forward" aria-label="前进5秒">5s ↷</button></div><div class="timeline"><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度"><div><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div><button id="close" aria-label="关闭播放器">×</button></section>
<audio id="audio" preload="metadata"></audio><script src="contents.js"></script><script src="app.js"></script></body></html>
