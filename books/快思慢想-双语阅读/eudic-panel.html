<style>#eudicStatus{font-size:13px;white-space:pre-wrap;margin:15px 0}#eudicPanel label{display:block;margin-top:15px}#eudicPanel select{width:100%;margin-bottom:12px}#eudicPanel input{box-sizing:border-box}#eudicWord{font:22px Georgia,serif}#eudicFeedback{white-space:pre-wrap;font-size:14px;min-height:40px}.eudic-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#eudicPanel a,#eudicLookup a{color:var(--accent)}</style>
<dialog id="eudicPanel"><h2>连接欧路生词本</h2><div id="eudicLocalHint" class="notice" hidden>请先在原页面「备份全部」，然后双击 reader 文件夹中的 start-eudic.cmd。它会打开本机连接版；用「恢复备份」带入已有笔记。连接版和直接打开 HTML 使用不同的笔记库。</div><p class="small">登录<a href="https://my.eudic.net/OpenAPI/Doc_Index" target="_blank" rel="noopener noreferrer">欧路 OpenAPI</a>，复制个人授权信息到下方。授权只保存在本机连接程序的内存中，关闭程序后需重新连接。</p><label for="eudicToken">完整 API 授权信息（通常以 NIS 开头）</label><input id="eudicToken" type="password" autocomplete="off" placeholder="只在这里粘贴，无需发到聊天中"><button id="eudicConnect" class="primary">连接并读取生词本</button><div id="eudicStatus" role="status" aria-live="polite"></div><div id="eudicTargets" hidden><label for="eudicCategory">选择已有生词本</label><select id="eudicCategory"></select><button id="eudicChoose">使用所选生词本</button><label for="eudicName">或者新建专用生词本</label><input id="eudicName" value="快思慢想 · 阅读生词" maxlength="80"><button id="eudicCreate">新建并使用（同名则复用）</button><p class="small">选好后，点击「欧路查词并收藏」会把该单词发送至欧路并加入这里指定的生词本。完整释义在欧路网站另开页面查看。</p><button id="eudicDisconnect">断开账号</button></div><div class="dialog-actions"><button id="eudicClose">关闭</button></div></dialog>
<dialog id="eudicLookup"><h2>查词并加入专用生词本</h2><input id="eudicWord" aria-label="要查询的英文单词或词组" maxlength="80"><p class="small">可修改为词典原形，例如将 impressions 改为 impression。</p><div class="eudic-actions"><button id="eudicDoLookup" class="primary">欧路查词并收藏</button><button id="eudicSettings">连接设置</button></div><div id="eudicFeedback" role="status" aria-live="polite"></div><a id="eudicDictLink" target="_blank" rel="noopener noreferrer" hidden>打开欧路释义页面</a><div class="dialog-actions"><button id="eudicLookupClose">关闭</button></div></dialog>
<script>
(()=>{
const E=id=>document.getElementById(id);let csrf='',connected=false,target=null,categories=[],busy=false,originalTerm='';
const authHelp=document.querySelector('#eudicPanel p.small');authHelp.replaceChildren();const authLink=document.createElement('a');authLink.href='https://my.eudic.net/OpenAPI/Authorization';authLink.target='_blank';authLink.rel='noopener noreferrer';authLink.textContent='欧路个人授权页面';authHelp.append('如需更换账号，请从 ',authLink,' 获取完整授权。凭证由 Windows 为当前用户加密保存在本机，重启连接程序后自动读取。点「断开账号」会清除保存的凭证。');
const local=location.origin==='http://127.0.0.1:18746';
const settings=document.createElement('button');settings.textContent='欧路生词本';settings.onclick=openSettings;document.querySelector('.tools').append(settings);
const lookup=document.createElement('button');lookup.textContent='欧路查词并收藏';lookup.onclick=()=>{if(!selected||selected.lang!=='en'){alert('请先选中英文单词或短语。');return;}originalTerm=selected.text.trim();E('eudicWord').value=originalTerm;E('eudicFeedback').textContent=target?'将加入：'+target.name:'请先连接欧路并选择专用生词本。';E('eudicDictLink').hidden=true;E('selectionBar').hidden=true;E('eudicLookup').showModal();};E('selectionBar').prepend(lookup);
const lookupStyle=document.createElement('style');lookupStyle.textContent='.looked-up{background:#d8eee9;border-bottom:2px solid #70a797;border-radius:2px}mark .looked-up{background:transparent}body.dark .looked-up{background:#345a4e;border-color:#8dc2b0}body.dark mark .looked-up{background:transparent}';document.head.append(lookupStyle);
const legend=document.createElement('p');legend.className='small';legend.textContent='浅绿色：本阅读器查过的词 · 黄色：手动高亮';document.querySelector('.notes .hint').after(legend);
async function api(path,body){if(!local)throw Error('请先双击 start-eudic.cmd 打开连接版阅读器。');const r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json','X-Reader-Key':csrf},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(30000)});const data=await r.json();if(!r.ok||data.error)throw Error(data.error||'连接失败');return data;}
function options(){E('eudicTargets').hidden=!connected;E('eudicCategory').replaceChildren();for(const c of categories){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;E('eudicCategory').append(o);}if(target)E('eudicCategory').value=target.id;settings.textContent=target?'欧路 · 已连接':'欧路生词本';}
async function refresh(){const d=await api('status');csrf=d.csrf;connected=d.connected;target=d.target;categories=d.categories;options();}
async function openSettings(){E('eudicPanel').showModal();E('eudicLocalHint').hidden=local;E('eudicConnect').disabled=!local;try{if(local){await refresh();E('eudicStatus').textContent=target?'当前目标：'+target.name:connected?'已连接，请选择生词本。':'尚未连接。';}}catch(e){E('eudicStatus').textContent='本机连接程序不可用，请重新启动 start-eudic.cmd。';}}
async function task(fn){if(busy)return;busy=true;for(const id of ['eudicConnect','eudicChoose','eudicCreate','eudicDisconnect'])E(id).disabled=true;E('eudicStatus').textContent='正在处理…';try{await fn();}catch(e){E('eudicStatus').textContent=e.message;}finally{busy=false;for(const id of ['eudicConnect','eudicChoose','eudicCreate','eudicDisconnect'])E(id).disabled=!local;}}
E('eudicConnect').onclick=()=>task(async()=>{const token=E('eudicToken').value.trim();E('eudicToken').value='';const d=await api('connect',{token});connected=true;target=null;categories=d.categories;options();E('eudicStatus').textContent='已连接。请选择或新建专用生词本。';});
E('eudicChoose').onclick=()=>task(async()=>{target=(await api('target',{id:E('eudicCategory').value})).target;options();E('eudicStatus').textContent='查词将自动加入：'+target.name;});
E('eudicCreate').onclick=()=>task(async()=>{const d=await api('create',{name:E('eudicName').value});target=d.target;categories=d.categories;options();E('eudicStatus').textContent='查词将自动加入：'+target.name;});
E('eudicDisconnect').onclick=()=>task(async()=>{await api('disconnect',{});connected=false;target=null;categories=[];options();E('eudicStatus').textContent='已断开，内存及本机保存的授权信息已清除。';});
E('eudicClose').onclick=()=>E('eudicPanel').close();E('eudicLookupClose').onclick=()=>E('eudicLookup').close();E('eudicSettings').onclick=openSettings;
E('eudicDoLookup').onclick=async()=>{const word=E('eudicWord').value.trim().replace(/’/g,"'");if(!/^[A-Za-z]+(?:[' -][A-Za-z]+){0,5}$/.test(word)||word.length>80){E('eudicFeedback').textContent='请选择一个英文单词或简短词组。';return;}if(!local||!target){E('eudicFeedback').textContent='请先打开「连接设置」，连接欧路并选择专用生词本。';return;}const url='https://dict.eudic.net/dicts/en/'+encodeURIComponent(word);E('eudicDictLink').href=url;E('eudicDictLink').hidden=false;window.open(url,'_blank','noopener,noreferrer');E('eudicDoLookup').disabled=true;E('eudicFeedback').textContent='已打开词典，正在加入生词本…';try{const d=await api('collect',{word});E('eudicFeedback').textContent=`欧路已确认添加请求：${word}\n生词本：${d.target.name}\n${d.message}`;}catch(e){E('eudicFeedback').textContent='未确认收藏成功：'+e.message+'\n可以稍后再次点击重试，重复单词会去重。';}finally{E('eudicDoLookup').disabled=false;}};
E('eudicDoLookup').addEventListener('click',()=>{const word=E('eudicWord').value.trim().replace(/’/g,"'");if(local&&target&&/^[A-Za-z]+(?:[' -][A-Za-z]+){0,5}$/.test(word)&&word.length<=80)rememberLookup(word,originalTerm);});
if(local)refresh().catch(()=>{});
})();
</script>
